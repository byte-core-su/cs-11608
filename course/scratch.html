<!DOCTYPE html>
<html lang="zh-TW">
<head>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  html, body, button, input, select, textarea { font-family:'Noto Sans TC', system-ui, sans-serif; }
  .tape{position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(-3deg);
        width:76px;height:26px;border-radius:2px;background:rgba(250,204,21,.3);
        box-shadow:0 1px 2px rgba(0,0,0,.08);z-index:5}
  .underline-doodle{background:linear-gradient(transparent 62%, rgba(250,204,21,.55) 62%)}
  .hl  {background:linear-gradient(transparent 52%, rgba(250,204,21,.65) 52%);font-weight:800}
  .hl-b{background:linear-gradient(transparent 52%, rgba(147,197,253,.7) 52%);font-weight:800}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .pop{animation:pop .35s ease-out both}

<script src="../config.js"></script>
<script src="../shared/term.js"></script>
<!-- 別的學期沒有這一頁（Scratch 十關是下學期的）⇒ 回闖關基地 -->
<script>if (!CONFIG.BLOCKS) location.replace('hub.html');</script>
<script src="../shared/auth.js"></script>
<script src="../shared/guard.js"></script>

<script>if (CONFIG.BLOCKS) TERMSEL.include(CONFIG.BLOCKS.CONTENT);</script>

<body class="ac-theme-bg text-slate-800 min-h-screen pb-24">
<!-- =====================================================================
     🐱 Scratch 程式設計：闖關地圖（下學期）
     ---------------------------------------------------------------------
     ★ 十關全部開放，順序學生自己決定。點卡片進 level.html，一關一頁走完五個步驟。
     ★ 每一關兩組星星，各自算各自的，**不相加**：
         🧩 作品星 —— 上傳 .sb3 和範例比對（根目錄 config.js 有設 GRADER_URL 才有）
         🧠 概念星 —— 概念檢測五題講到幾題（每次從 modules.scratch.quiz 現算）
       第 5、10 關沒有作品要交（{學期}/config.js 的 NO_UPLOAD），做完最後的「實作體驗」就算完成。
     ★ 第一次進來先跑新手訓練（warmup.html）：教「怎麼把卡住的地方講出來」。
     ===================================================================== -->

<a id="back-to-hub" href="hub.html" title="返回闖關基地"
   class="fixed top-4 left-4 z-50 inline-flex items-center gap-1.5 bg-slate-800 text-white
          font-bold text-sm px-3.5 py-2 rounded-full shadow-lg hover:bg-slate-700 transition">← 返回基地</a>
<script>
if(window.self!==window.top){var b=document.getElementById('back-to-hub');if(b)b.style.display='none';}
</script>

<main class="w-full max-w-[96vw] xl:max-w-[1680px] mx-auto px-4 pt-20">

  <div class="max-w-4xl mx-auto">
    <header class="text-center mb-8 pop">
      <span class="inline-block text-xs font-bold px-2.5 py-1 rounded-full border
                   border-orange-300 bg-orange-50 text-orange-700 mb-3">🐱 程式設計</span>
      <h1 class="text-3xl sm:text-4xl font-black">
        <span class="underline-doodle">Scratch 程式設計闖關</span>
      </h1>
      <p class="mt-3 text-slate-500 text-sm sm:text-base">
        <span class="hl-b">10</span> 關全部開放，順序自己決定。一關一個作品。
      </p>
    </header>

    <!-- 進度摘要：兩組星星分開顯示（加起來就看不出「我到底是哪一種還沒做」） -->
    <section class="relative bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-8 pop">
      <div class="tape"></div>
      <div class="flex flex-wrap items-center justify-between gap-3">
        <h2 class="text-lg sm:text-xl font-black leading-relaxed text-center flex-1">
          <span class="text-orange-600">🐱 完成 <span id="done-count">0</span> / <span id="unit-count">10</span> 關</span>
          <span class="block sm:inline mt-1 sm:mt-0 sm:ml-3">
            <span id="work-wrap">🧩 作品 <span id="total-star" class="text-amber-500 text-2xl font-black">0</span>⭐
            <span class="text-slate-300 mx-1">·</span></span>
            🧠 概念 <span id="quiz-star" class="text-indigo-500 text-2xl font-black">0</span>⭐
          </span>
        </h2>
        <div class="inline-flex rounded-full bg-amber-100/80 p-1 border-2 border-amber-200 mx-auto sm:mx-0">
          <button type="button" data-sc-view="island" class="sc-view-btn px-3 py-1 rounded-full text-xs font-black transition bg-emerald-500 text-white shadow">🏝️ 島嶼探險</button>
          <button type="button" data-sc-view="list" class="sc-view-btn px-3 py-1 rounded-full text-xs font-black transition text-stone-600 hover:text-stone-900">📋 卡片清單</button>
        </div>
      </div>
      <p id="rules" class="text-slate-500 text-xs sm:text-sm mt-2 text-center leading-relaxed"></p>
    </section>

    <!-- 學習目標 -->
    <section class="relative bg-white rounded-2xl border border-slate-200 shadow-sm p-6 mb-8 pop">
      <div class="tape"></div>
      <h2 class="font-black text-lg mb-3">🎯 這個模組你會學到</h2>
      <ul class="space-y-2 text-slate-700 text-sm sm:text-base">
        <li>• 用<span class="hl">自訂積木</span>把一段會重複用到的程式包起來，像食譜裡的「基本高湯」</li>
        <li>• 用<span class="hl">參數</span>讓同一個積木做出不一樣的結果</li>
        <li>• 用<span class="hl">如果…那麼</span>和<span class="hl">變數</span>做出會判斷的遊戲</li>
        <li>• 兩種<span class="hl">排序法</span>、兩種<span class="hl">搜尋法</span>，最後比一比哪一種比較快</li>
      </ul>
    </section>
  </div>

  <!-- 3D 島嶼探險容器 -->
  <div id="sc-island-mount" class="mb-8"></div>

  <!-- 闖關地圖（卡片清單模式） -->
  <div id="sc-list-wrap" class="max-w-4xl mx-auto hidden">
    <section class="mb-8">
      <div class="flex items-baseline justify-between mb-4">
        <h2 class="font-black text-xl">🗺️ 闖關地圖</h2>
        <span id="map-note" class="text-xs font-bold text-slate-400"></span>
      </div>
      <div id="stage-grid" class="grid gap-4 sm:grid-cols-2"></div>
    </section>

    <section class="relative bg-white rounded-2xl border border-slate-200 shadow-sm p-6 mb-8 text-center">
      <p class="text-sm text-slate-600 leading-relaxed">
        📤 <b>點上面的卡片進去</b>，走完<span class="hl">情境解說 → 問題分析 → 概念檢測 → 程式拼圖 → 實作測試</span>；
        <span id="upload-note"></span>
      </p>
    </section>
  </div>

</main>

<script>
/* 卡片上那一句說明 ＝ 關卡資料自己的 task（不在這裡另抄一份） */
function descOf(id) {
  const lv = (window.BLOCK_LEVELS || {})[id];
  if (!lv || !lv.task) return '';
  return String(lv.task).replace(/<[^>]*>/g, '');
}
const UNITS = (window.CONFIG.UNITS || []).map(function (u, i) {
  return { no: i + 1, id: u[0], name: u[1], desc: descOf(u[0]) };
});
const GATE = (window.GRADING && window.GRADING.GATE) || { needsUpload: function(){ return true; } };
/* 有沒有作品星：要接 Apps Script 評分（根目錄 config.js 的 GRADER_URL） */
const WORK = !!String(window.CONFIG.GRADER_URL || '').trim();
const NO_UP = UNITS.filter(u => !GATE.needsUpload(u.id));

let unitStars = {};   // 作品星：{ '4-2-1': 3, … }　Apps Script 寫進 {學期}-progress
let quizDone  = {};   // 概念檢測成績：{ '4-2-1': { score: 4 } }　概念星由它現算
let playDone  = {};   // 沒有作品要交的關卡：實作體驗做完了沒
let scViewMode = 'island';

/* ===================== 畫面 ===================== */
function renderStages(){
  document.getElementById('stage-grid').innerHTML = UNITS.map(u => {
    const s = unitStars[u.id] || 0;
    const q = (window.GRADING && window.GRADING.quizStars) ? window.GRADING.quizStars(quizDone, u.id) : 0;
    /* 沒有作品要交的關卡：看「實作體驗做完了沒」，不看作品星（永遠是 0） */
    const needUp = GATE.needsUpload(u.id);
    const done = needUp ? (WORK ? s >= 2 : q > 0) : !!playDone[u.id];
    return `
      <a href="level.html?unit=${encodeURIComponent(u.id)}" class="relative block rounded-2xl border shadow-sm p-5 pop
             ${done ? 'bg-white border-emerald-300 ring-2 ring-emerald-200 hover:shadow-lg hover:-translate-y-0.5 transition'
                    : 'bg-white border-slate-200 hover:border-orange-300 hover:shadow-lg hover:-translate-y-0.5 transition'}">
        <div class="flex items-start justify-between gap-3">
          <div>
            <span class="text-xs font-bold px-2.5 py-1 rounded-full border border-slate-200 bg-slate-50 text-slate-500">第 ${String(u.no).padStart(2,'0')} 關</span>
            <h3 class="font-black text-lg mt-2">${u.name}</h3>
          </div>
          <span class="text-right whitespace-nowrap leading-tight">
            ${!needUp
              /* 沒有作品要交：一枚體驗章（不是作品星，不進任何星數） */
              ? `<span class="block text-base font-black ${done ? 'text-amber-500' : 'text-slate-300'}" title="這一關沒有程式作品要交，做完最後的實作體驗就算完成">
                   <span class="text-[13px] font-black">${done ? '🏅 體驗完成' : '○ 體驗'}</span></span>`
              : WORK ? `<span class="block text-base font-black ${s > 0 ? 'text-amber-500' : 'text-slate-300'}" title="作品星：上傳 .sb3 和範例比對">
                   🧩 ${s > 0 ? '★'.repeat(s) + '☆'.repeat(3 - s) : '☆☆☆'}</span>` : ''}
            <span class="block text-base font-black ${q > 0 ? 'text-indigo-500' : 'text-slate-300'}" title="概念星：概念檢測五題講到幾題">
              🧠 ${q > 0 ? '★'.repeat(q) + '☆'.repeat(3 - q) : '☆☆☆'}
            </span>
          </span>
        </div>
        <p class="mt-2 text-slate-600 text-sm leading-relaxed">${u.desc || '<span class="text-slate-400">內容準備中</span>'}</p>
        <p class="mt-3 text-xs font-bold ${done ? 'text-emerald-600' : 'text-orange-600'}">
          ${done ? '✅ 已完成　點進去可以重做' : (needUp ? '👉 點進去開始這一關' : '👉 點進去開始（這一關做完最後的體驗就算完成）')}
        </p>
      </a>`;
  }).join('');
}

function renderTotal(){
  const t = (window.GRADING && window.GRADING.scratchTotal) ? window.GRADING.scratchTotal(unitStars).stars : 0;
  document.getElementById('total-star').textContent = t;
  const q = (window.GRADING && window.GRADING.quizTotal) ? window.GRADING.quizTotal(quizDone).stars : 0;
  document.getElementById('quiz-star').textContent = q;
  const done = UNITS.filter(u => GATE.needsUpload(u.id)
    ? (WORK ? (unitStars[u.id] || 0) >= 2 : window.GRADING.quizStars(quizDone, u.id) > 0)
    : !!playDone[u.id]).length;
  document.getElementById('done-count').textContent = done;
  document.getElementById('unit-count').textContent = UNITS.length;
}

function mountScratchIsland(){
  const mountEl = document.getElementById('sc-island-mount');
  const listEl = document.getElementById('sc-list-wrap');
  if (!mountEl || !listEl) return;

  document.querySelectorAll('.sc-view-btn').forEach(btn => {
    const on = btn.getAttribute('data-sc-view') === scViewMode;
    btn.className = 'sc-view-btn px-3 py-1 rounded-full text-xs font-black transition '
      + (on ? 'bg-emerald-500 text-white shadow' : 'text-stone-600 hover:text-stone-900');
  });

  if (scViewMode === 'list' || !window.AC_ISLAND) {
    mountEl.classList.add('hidden');
    listEl.classList.remove('hidden');
    return;
  }
  mountEl.classList.remove('hidden');
  listEl.classList.add('hidden');

  const unitCoords = [
    { x: 20, y: 68, kind: 'craft-forge',     icon: '🍽️' }, // 01 點餐幫手
    { x: 35, y: 62, kind: 'craft-watermill', icon: '📐' }, // 02 正多邊形
    { x: 24, y: 47, kind: 'craft-clockwork', icon: '🧱' }, // 03 打磚塊
    { x: 42, y: 44, kind: 'craft-minecart',  icon: '💰' }, // 04 接金幣
    { x: 58, y: 48, kind: 'craft-sawmill',   icon: '🚀' }, // 05 星際防禦
    { x: 74, y: 63, kind: 'craft-forge',     icon: '🏃' }, // 06 大隊接力
    { x: 77, y: 42, kind: 'craft-watermill', icon: '🫧' }, // 07 氣泡排序
    { x: 32, y: 24, kind: 'craft-minecart',  icon: '🔎' }, // 08 循序搜尋
    { x: 52, y: 23, kind: 'craft-sawmill',   icon: '🎯' }, // 09 二分搜尋
    { x: 70, y: 22, kind: 'craft-clockwork', icon: '⚡' }  // 10 搜尋PK賽
  ];

  const firstTodo = UNITS.find(u => {
    const s = unitStars[u.id] || 0;
    const q = (window.GRADING && window.GRADING.quizStars) ? window.GRADING.quizStars(quizDone, u.id) : 0;
    const needUp = GATE.needsUpload(u.id);
    return !(needUp ? (WORK ? s >= 2 : q > 0) : !!playDone[u.id]);
  });

  const islandNodes = UNITS.map((u, idx) => {
    const s = unitStars[u.id] || 0;
    const q = (window.GRADING && window.GRADING.quizStars) ? window.GRADING.quizStars(quizDone, u.id) : 0;
    const needUp = GATE.needsUpload(u.id);
    const done = needUp ? (WORK ? s >= 2 : q > 0) : !!playDone[u.id];
    const pos = unitCoords[idx] || { x: 50, y: 50, kind: 'craft-forge', icon: '🐱' };
    const href = 'level.html?unit=' + encodeURIComponent(u.id);
    const starParts = [];
    if (!needUp) {
      if (done) starParts.push('🏅體驗');
    } else if (WORK && s > 0) {
      starParts.push('🧩' + s + '⭐');
    }
    if (q > 0) starParts.push('🧠' + q + '⭐');

    return {
      id: u.id,
      x: pos.x,
      y: pos.y,
      kind: pos.kind,
      icon: pos.icon,
      badge: String(u.no).padStart(2, '0'),
      tag: '第 ' + String(u.no).padStart(2, '0') + ' 關 · ' + u.id,
      title: String(u.no).padStart(2, '0') + '. ' + u.name,
      shortTitle: u.name,
      desc: u.desc || '走進蒸氣工坊完成情境解說、問題分析、概念檢測、程式拼圖與實作測試！',
      pass: done,
      starsText: starParts.join(' '),
      statusLabel: done ? '已完成' : '待挑戰',
      flagText: firstTodo && firstTodo.id === u.id ? '👉 推薦下一關' : '',
      flagKind: 'next',
      locked: false,
      actions: [{ label: done ? '🐱 再進去練習 →' : '🐱 開始這一關 →', href: href, primary: true }]
    };
  });

  islandNodes.push({
    id: 'warmup-node',
    x: 16,
    y: 32,
    kind: 'craft-robot',
    icon: '🤖',
    tag: '發條機器人訓練塔',
    title: '🔰 新手訓練：怎麼把卡住的地方講出來',
    shortTitle: '新手訓練營',
    desc: '五關暖身練習：學會把程式卡住的地方清楚講出來，後面每一關的問題分析都會用到！',
    pass: true,
    starsText: '暖身特訓',
    statusLabel: '隨時可練',
    locked: false,
    actions: [{ label: '進入新手訓練 🔰', href: 'warmup.html', primary: true }]
  });

  window.AC_ISLAND.mount(mountEl, {
    pageId: 'scratch_' + (window.CONFIG.TERM || '11502'),
    variant: 'code',
    playerName: '島民',
    startX: 50,
    startY: 76,
    initialSelectedId: (firstTodo && firstTodo.id) || (UNITS[0] && UNITS[0].id),
    nodes: islandNodes
  });
}

/* 說明文字跟著設定走（有沒有作品星、哪幾關不必交） */
(function () {
  const up = UNITS.length - NO_UP.length;
  const noUp = NO_UP.map(u => '第 ' + u.no + ' 關（' + u.name + '）').join('、');
  document.getElementById('work-wrap').style.display = WORK ? '' : 'none';
  document.getElementById('rules').innerHTML =
    (WORK ? `<b class="text-amber-600">🧩 作品星</b>：在 Scratch 做出來、上傳 .sb3，和範例比對，每關最多 3⭐（2⭐ 算過關）；` : '') +
    `<b class="text-indigo-600">🧠 概念星</b>：概念檢測五題講到幾題，每關最多 3⭐（十關滿 30）。` +
    (NO_UP.length ? `<span class="block mt-1">⚠️ <b>${noUp}沒有程式作品要交</b>，做完最後的<b>實作體驗</b>就算完成，卡片上給一枚 <b class="text-amber-600">🏅 體驗完成</b>（不是星星）。` +
      (WORK ? `所以作品星的滿分是 <b>${up} 關</b>（${up * 3}⭐）。` : '') + `</span>` : '') +
    (WORK ? `<span class="block mt-1 text-slate-400">兩組<b>分開算、不相加</b>：作品星是「做出來了沒」，概念星是「懂了沒」。</span>` : '');
  document.getElementById('map-note').textContent = WORK ? '🧩 作品星 2⭐ 過關，最多 3⭐ ｜ 🧠 概念星最多 3⭐' : '🧠 概念星每關最多 3⭐';
  document.getElementById('upload-note').innerHTML = WORK
    ? '最後一步把作品<b>上傳評分</b>，拿作品星。'
    : '最後一步在 Scratch 做出來，<b>照老師說的方式交作品</b>。';
})();

function repaint(){ renderStages(); renderTotal(); mountScratchIsland(); }

document.addEventListener('click', function (e) {
  const vb = e.target.closest('.sc-view-btn');
  if (vb) {
    scViewMode = vb.getAttribute('data-sc-view') || 'island';
    mountScratchIsland();
  }
});

/* 讀完進度的那支 module script 用這個把資料交進來 */
window.applyStars = function (obj, quiz, play) {
  unitStars = obj || {};
  quizDone = quiz || {};
  playDone = play || {};
  repaint();
};
repaint();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  const app  = initializeApp(window.CONFIG.FIREBASE);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  // 身分由闖關基地建立（guard.js 已擋掉沒登入的人），這裡只取學號
  const sid = sessionStorage.getItem('sid' + window.CONFIG.TERM);

  onAuthStateChanged(auth, async user => {
    if (!user || !sid) return;
    try {
      const snap = await getDoc(doc(db, window.CONFIG.COLLECTIONS.PROGRESS, sid));
      const sc = ((snap.exists() && snap.data().modules) || {}).scratch || {};

      /* ── 第一次進來 → 先跑新手訓練（warmup.html）──────
         這五關教的是「怎麼把卡住的地方講出來」，後面每一關的問題分析都要用到。
         ★ 強制而不是放在首頁讓人自己點：自己點的話，最需要練的那些學生正好不會點。
         ⚠️ 三道保險：① sessionStorage：寫失敗時這一節課不會一直被踢回去
                      ② 讀進度失敗（catch）不導向　③ 用 replace：按上一頁不會又被彈回訓練頁 */
      let ranThisSession = false;
      try { ranThisSession = sessionStorage.getItem('warmup' + window.CONFIG.TERM) === '1'; } catch (e) {}
      if (!sc.warmup && !ranThisSession) { location.replace('warmup.html'); return; }

      window.applyStars(sc.unitStars || {}, sc.quiz || {}, sc.play || {});
    } catch (e) {
      console.error('讀進度失敗', e);
      const box = document.getElementById('stage-grid');
      if (box) {
        const p = document.createElement('p');
        p.className = 'sm:col-span-2 text-sm font-bold text-amber-700 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3';
        p.textContent = '⚠️ 讀不到你的闖關進度，畫面可能不是最新的。請重新整理，若一直這樣請找老師。';
        box.prepend(p);
      }
    }
  });

  AUTH.attachSession(auth, signInAnonymously, onAuthStateChanged);
</script>
</body>
</html>
