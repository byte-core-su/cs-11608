<style>

<body class="ac-theme-bg min-h-screen">
    <div id="root" class="min-h-screen"></div>

    <!-- 加入 data-type="module" 解決 Babel 解析 import 問題 -->
    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;

        // --- Icon 組件 (SVG) ---
        const Icon = ({ path, className }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width="24" height="24" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {path}
            </svg>
        );

        const Icons = {
            User: (props) => <Icon {...props} path={<><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>} />,
            LogOut: (props) => <Icon {...props} path={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></>} />,
            Play: (props) => <Icon {...props} path={<polygon points="5 3 19 12 5 21 5 3"/>} />,
            BookOpen: (props) => <Icon {...props} path={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>} />,
            Monitor: (props) => <Icon {...props} path={<><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></>} />,
            Award: (props) => <Icon {...props} path={<><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></>} />,
            Clock: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>} />,
            Calendar: (props) => <Icon {...props} path={<><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></>} />,
            Timer: (props) => <Icon {...props} path={<><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></>} />,
            AlertCircle: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></>} />
        };

        // --- 全域時間與日期格式化工具 ---
        const formatTime = (seconds) => {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        };

        const formatDate = (date) => {
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 星期${days[date.getDay()]}`;
        };

        // 闖關基地登入後存學號的地方（sessionStorage）
        const SID_KEY = 'sid' + ((window.CONFIG && window.CONFIG.TERM) || '11501');

        // --- Firebase 資料庫設定與初始化 ---
        const fbStore = {
            db: null, doc: null, getDoc: null, setDoc: null, arrayUnion: null, collection: null, getDocs: null,
            query: null, where: null, auth: null
        };

        /* ── 通關截圖交給老師（背景上傳，gas/grader.gs 的 handleShot_）──────────
           過關照常馬上記錄（下面的 handleChallengeComplete），截圖之後才在背景送出：
           送不上去只顯示一行提示，**不影響過關**。
           · 沒設 GRADER_URL ⇒ 不送。老師沒設雲端硬碟資料夾 ⇒ 第一次回 skipped，這個分頁之後就不再送。
           · 超過 4 MB 或不是 PNG／JPG／WebP ⇒ 先縮成 1920 像素寬的 JPG 再送（一張約 0.2～0.5 MB）。
           · 相同截圖的比對在老師後台打開時才做，上課時不比對。 */
        const GRADER_URL = String((window.CONFIG && window.CONFIG.GRADER_URL) || '').trim();
        const SHOT_OFF_KEY = 'shotOff' + ((window.CONFIG && window.CONFIG.TERM) || '');
        const shotEnabled = () => {
            if (!GRADER_URL) return false;
            try { return !sessionStorage.getItem(SHOT_OFF_KEY); } catch (e) { return true; }
        };
        const blobToB64 = (blob) => new Promise((resolve, reject) => {
            const r = new FileReader();
            r.onload = () => resolve(String(r.result).split(',')[1] || '');
            r.onerror = () => reject(r.error);
            r.readAsDataURL(blob);
        });
        const shrinkImage = (file) => new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file), img = new Image();
            img.onload = () => {
                const k = Math.min(1, 1920 / (img.naturalWidth || 1920));
                const c = document.createElement('canvas');
                c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
                c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                URL.revokeObjectURL(url);
                c.toBlob(b => b ? resolve(b) : reject(new Error('縮圖失敗')), 'image/jpeg', 0.85);
            };
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('圖片打不開')); };
            img.src = url;
        });
        /** 回傳 'ok'（老師收到了）／'off'（老師沒開，不提示）／'fail'（沒送上去） */
        async function uploadShot(file, challenge) {
            if (!shotEnabled() || !fbStore.auth || !fbStore.auth.currentUser) return 'off';
            try {
                let blob = file, mime = file.type;
                if (!/^image\/(png|jpeg|webp)$/.test(mime) || file.size > 4 * 1024 * 1024) { blob = await shrinkImage(file); mime = 'image/jpeg'; }
                const idToken = await fbStore.auth.currentUser.getIdToken();
                /* ⚠️ 不設 Content-Type（預設 text/plain）：Apps Script 不處理跨網域的預檢請求 */
                const resp = await fetch(GRADER_URL, { method: 'POST',
                    body: JSON.stringify({ kind: 'shot', term: window.CONFIG.TERM, idToken, challenge: challenge.id, title: challenge.title, mime, b64: await blobToB64(blob) }) });
                const j = await resp.json();
                if (j.skipped) { try { sessionStorage.setItem(SHOT_OFF_KEY, '1'); } catch (e) {} return 'off'; }
                if (!j.ok) console.warn('截圖沒有存進去：', j.message);
                return j.ok ? 'ok' : 'fail';
            } catch (err) { console.warn('截圖上傳失敗：', err); return 'fail'; }
        }


        /* 班級進度：只抓自己班、抓一次就快取。
           「換一題」「完成一題」都不重抓 —— 30 人同時上課時，每次重抓都是全班 ×30 次讀取，
           很快就會用完 Firebase 免費額度（額度用完的症狀是「讀不到進度」，隔天才會好）。
           自己完成一題時用 noteMyPass 更新快取裡自己那一筆。 */
        const classCache = { room: '', rows: null };

        const THINKING_COL_SEGMENTS = () => (window.CONFIG.COLLECTIONS && window.CONFIG.COLLECTIONS.THINKING)
            ? [window.CONFIG.COLLECTIONS.THINKING]
            : ['artifacts', 'comp-think-app', 'public', 'data', 'progress'];

        async function loadClassRows(classRoom, force) {
            if (!classRoom) return [];
            if (!force && classCache.room === classRoom && classCache.rows) return classCache.rows;
            const ok = await initFB();
            if (!ok) throw new Error("Firebase 未就緒");
            const col = fbStore.collection(fbStore.db, ...THINKING_COL_SEGMENTS());
            /* where 是單一欄位相等比較，不需要另外建索引 */
            const q = (fbStore.query && fbStore.where)
              ? fbStore.query(col, fbStore.where('classRoom', '==', classRoom)) : col;
            const snap = await fbStore.getDocs(q);
            const rows = [];
            snap.forEach(d => { const v = d.data(); if (v.classRoom === classRoom) rows.push(v); });
            classCache.room = classRoom; classCache.rows = rows;
            return rows;
        }

        /** 自己剛通過一關：更新快取裡自己那一筆，不要再抓一次全班 */
        function noteMyPass(classRoom, seatNo, challengeId) {
            if (classCache.room !== classRoom || !classCache.rows) return;
            let me = classCache.rows.find(r => String(r.seatNo) === String(seatNo));
            if (!me) { me = { classRoom, seatNo, completed: [] }; classCache.rows.push(me); }
            me.completed = me.completed || [];
            if (!me.completed.includes(challengeId)) me.completed.push(challengeId);
        }

        const initFB = async () => {
            if (fbStore.db) return true;
            try {
                // 使用 new Function 包裝 import，防止 Babel 將 import() 編譯為 require()
                const { initializeApp, getApps, getApp } = await new Function("return import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js')")();
                const { getFirestore, doc, getDoc, setDoc, arrayUnion, collection, getDocs, query, where } = await new Function("return import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js')")();
                const { getAuth, signInAnonymously, onAuthStateChanged } = await new Function("return import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js')")();

                const firebaseConfig = window.CONFIG.FIREBASE;

                const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
                const auth = getAuth(app);
                
                try {
                    // 已經有身分（在闖關基地登入過）就沿用，不要再匿名登入把它蓋掉
                    await AUTH.attachSession(auth, signInAnonymously, onAuthStateChanged);
                } catch (authErr) {
                    console.warn("登入狀態讀取失敗:", authErr);
                }
                
                fbStore.db = getFirestore(app);
                fbStore.doc = doc;
                fbStore.getDoc = getDoc;
                fbStore.setDoc = setDoc;
                fbStore.arrayUnion = arrayUnion;
                fbStore.collection = collection;
                fbStore.getDocs = getDocs;
                fbStore.query = query;
                fbStore.where = where;
                fbStore.auth = auth;
                return true;
            } catch (err) {
                console.error("Firebase 初始化失敗:", err);
                return false;
            }
        };

        // --- 班級過關紀錄查詢 Modal 組件 ---
        const QueryModal = ({ onClose, userClass }) => {
            const [studentsData, setStudentsData] = useState([]);
            const [loadingData, setLoadingData] = useState(true);
            const [errorMsg, setErrorMsg] = useState("");

            useEffect(() => {
                const fetchClassData = async () => {
                    setLoadingData(true);
                    setErrorMsg("");
                    try {
                        const ok = await initFB();
                        if (!ok) throw new Error("資料庫連線失敗");

                        /* 只抓自己班、而且走同一份快取（見 loadClassRows）。
                           這是使用者按開的視窗，重新整理一次是合理的，
                           所以 force = true；換題那一支就不重抓。 */
                        const data = (await loadClassRows(userClass, true)).slice();
                        
                        data.sort((a, b) => parseInt(a.seatNo) - parseInt(b.seatNo));
                        setStudentsData(data);
                        
                        if(data.length === 0) setErrorMsg(`目前 ${userClass} 班尚無任何通關紀錄。`);
                    } catch (err) {
                        setErrorMsg("查詢失敗，請確認 Firebase 資料庫規則已設為允許讀取。" + err.message);
                    } finally {
                        setLoadingData(false);
                    }
                };
                fetchClassData();
            }, [userClass]);

            return (
                <div className="ac-float-backdrop">
                    <div className="ac-float-window theme-carnival p-5 sm:p-7 max-w-4xl w-full mx-auto relative flex flex-col max-h-[90vh]">
                        <div className="ac-window-badge">🎪 森林奇幻遊樂園 · 班級通關榜</div>
                        <div className="bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col flex-1 min-h-0 border border-pink-100">
                        <div className="bg-indigo-600 px-6 py-4 flex justify-between items-center shrink-0">
                            <h3 className="text-xl font-bold text-white"><i className="fa-solid fa-users mr-2"></i>{userClass} 班過關紀錄查詢</h3>
                            <button onClick={onClose} className="text-indigo-200 hover:text-white transition-colors">
                                <i className="fa-solid fa-xmark text-2xl"></i>
                            </button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-6 bg-slate-50">
                            {loadingData ? (
                                <div className="text-center text-slate-500 py-16 flex flex-col items-center">
                                    <i className="fa-solid fa-spinner animate-spin text-5xl mb-4 text-indigo-500"></i>
                                    <p className="font-medium">正在載入 {userClass} 班的資料...</p>
                                </div>
                            ) : errorMsg ? (
                                <div className="text-center text-slate-500 py-10 font-medium bg-white rounded-xl border border-dashed border-slate-300">
                                    {errorMsg}
                                </div>
                            ) : (
                                <div className="overflow-hidden rounded-xl border border-slate-200 shadow-sm bg-white">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-100 text-slate-700 text-sm">
                                                <th className="p-4 border-b border-slate-200 font-bold w-20">座號</th>
                                                <th className="p-4 border-b border-slate-200 font-bold w-32">姓名</th>
                                                <th className="p-4 border-b border-slate-200 font-bold w-24 text-center">過關數</th>
                                                <th className="p-4 border-b border-slate-200 font-bold">已通關關卡 (游標懸停顯示獨立通關日期)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="text-sm">
                                            {studentsData.map((student, idx) => (
                                                <tr key={idx} className="hover:bg-slate-50 transition-colors border-b border-slate-100 last:border-0">
                                                    <td className="p-4 text-slate-600 font-mono font-bold">{student.seatNo}</td>
                                                    <td className="p-4 font-bold text-slate-800">{student.name}</td>
                                                    <td className="p-4 text-center">
                                                        <span className="bg-emerald-100 text-emerald-700 font-bold px-2.5 py-1 rounded-full">
                                                            {student.completed ? student.completed.length : 0}
                                                        </span>
                                                    </td>
                                                    <td className="p-4 text-slate-500 font-medium">
                                                        {student.completed && student.completed.length > 0 ? (
                                                            <div className="flex flex-wrap gap-2">
                                                                {student.completed.sort((a,b)=>a-b).map(id => (
                                                                    <div key={id} className="group relative inline-block cursor-help">
                                                                        <span className="bg-indigo-50 text-indigo-700 px-2.5 py-1.5 rounded-lg text-xs font-bold border border-indigo-100 shadow-sm transition-colors group-hover:bg-indigo-600 group-hover:text-white">
                                                                            #{id}
                                                                        </span>
                                                                        <div className="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 hidden group-hover:block bg-slate-800 text-white text-xs px-3 py-2 rounded-lg whitespace-nowrap z-10 shadow-lg">
                                                                            <i className="fa-regular fa-calendar-check mr-1 text-emerald-400"></i>
                                                                            通關日期: {student.completionDates?.[id] || student[`completionDates.${id}`] || '未知 (舊紀錄)'}
                                                                            <div className="absolute top-full left-1/2 transform -translate-x-1/2 border-4 border-transparent border-t-slate-800"></div>
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        ) : '無'}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 個人通關證書檢視 Modal 組件 ---
        const MyCertificatesModal = ({ onClose, user, completedChallenges, completedDates, challenges }) => {
            const [selectedId, setSelectedId] = useState(
                completedChallenges.length > 0 ? [...completedChallenges].sort((a,b) => a-b)[0] : null
            );

            const currentChallenge = challenges.find(c => c.id === selectedId);
            const todayStr = formatDate(new Date());
            /* 日期統一顯示成「2026年9月3日 星期四」；資料庫裡若是 2026-09-03 這種寫法也轉過來 */
            const showDate = (v) => {
                const s = String(v || '');
                if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
                    const d = new Date(s + 'T00:00:00');
                    if (!isNaN(d)) return formatDate(d);
                }
                return s;
            };
            
            // 這一關的通關日期（沒有記錄就顯示今天）
            const passDate = showDate(completedDates[selectedId]) || todayStr;

            return (
                <div className="ac-float-backdrop">
                    <div className="ac-float-window theme-carnival p-5 sm:p-7 max-w-5xl w-full mx-auto animate-[fadeIn_0.3s_ease-out]">
                        <div className="ac-window-badge">🎡 森林奇幻遊樂園 · 榮譽摩天輪證書殿堂</div>
                        <div className="bg-white rounded-3xl shadow-xl w-full overflow-hidden flex flex-col md:flex-row min-h-[550px] border border-pink-100">
                        
                        <div className="w-full md:w-1/3 bg-slate-50 border-r border-slate-200 flex flex-col shrink-0 max-h-[50vh] md:max-h-none">
                            <div className="p-6 bg-indigo-600 text-white flex justify-between items-center shrink-0">
                                <h3 className="text-lg font-bold"><i className="fa-solid fa-trophy mr-2 text-amber-400"></i>我的成就庫</h3>
                                <button onClick={onClose} className="md:hidden text-indigo-200 hover:text-white transition-colors">
                                    <i className="fa-solid fa-xmark text-2xl"></i>
                                </button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                {completedChallenges.length === 0 ? (
                                    <div className="text-center text-slate-400 mt-10">
                                        <i className="fa-solid fa-folder-open text-5xl mb-4 opacity-50"></i>
                                        <p className="font-bold">尚未獲得任何證書</p>
                                        <p className="text-sm mt-1">請先去挑戰關卡吧！</p>
                                    </div>
                                ) : (
                                    [...completedChallenges].sort((a,b) => a-b).map(id => {
                                        const c = challenges.find(ch => ch.id === id);
                                        return (
                                            <button 
                                                key={id}
                                                onClick={() => setSelectedId(id)}
                                                className={`w-full text-left p-4 rounded-xl font-bold flex items-center justify-between transition-all ${
                                                    selectedId === id 
                                                        ? 'bg-indigo-100 text-indigo-800 border-2 border-indigo-400 shadow-sm' 
                                                        : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 hover:border-slate-300'
                                                }`}
                                            >
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm ${selectedId === id ? 'bg-indigo-500 text-white' : 'bg-slate-100 text-slate-400'}`}>

        // --- 通關確認 Modal 組件 ---
        /* 通關確認（自行回報）
           學生選一張通關截圖、按送出，就記錄這一關完成。
           · 截圖不會被檢查，也不會上傳 —— 需要時請學生當場打開通關畫面給老師看。
           · 關卡由截圖的檔名判定（見 levelFromFilename）：認不出來就當場擋下，
             請學生用「擷取整個視窗」重截，或把檔名改成關卡名開頭。 */
        const levelFromFilename = (name, challenges) => {
            const text = String(name || '');
            return challenges.find(c => c.title && text.indexOf(c.title) === 0)
                || challenges.find(c => c.title && text.indexOf(c.title) >= 0)
                || null;
        };

        const CertVerificationModal = ({ onClose, user, challenges, studyTime, onComplete, onOpenCerts }) => {
            const [isProcessing, setIsProcessing] = useState(false);
            const [selectedFile, setSelectedFile] = useState(null);
            const [previewUrl, setPreviewUrl] = useState(null);
            const [result, setResult] = useState(null);
            const [matched, setMatched] = useState(null);     // 由檔名認出的關卡
            const [nameNote, setNameNote] = useState("");     // 認不出時顯示的檔名
            const [shotState, setShotState] = useState("");   // 截圖交給老師：'' | 'sending' | 'ok' | 'fail'
            const fileInputRef = useRef(null);
            const [certDate] = useState(formatDate(new Date()));
            const [certTime] = useState(formatTime(studyTime));

            const handleFileChange = (e) => {
                if (e.target.files.length === 0) return;
                const file = e.target.files[0];
                setSelectedFile(file);
                const lv = levelFromFilename(file.name, challenges);
                setMatched(lv);
                setNameNote(lv ? "" : file.name);
                const reader = new FileReader();
                reader.onload = (event) => setPreviewUrl(event.target.result);
                setResult(null);            // 換了圖就清掉上一次的結果，按鈕才會再亮
                setShotState("");
                reader.readAsDataURL(file);
            };

            const submit = async () => {
                if (!selectedFile || !matched) return;
                setIsProcessing(true);
                setResult(null);
                try {
                    await onComplete(matched.id, certDate);
                    setResult({ status: 'pass', msg: (user.sid ? user.sid + ' ' : '') + matched.title + ' 已記錄完成　請到證書區查看' });
                    /* 過關已經記好了，截圖才在背景送（不等它） */
                    if (shotEnabled()) {
                        setShotState('sending');
                        uploadShot(selectedFile, matched).then(s => setShotState(s === 'off' ? '' : s));
                    }
                } catch (err) {
                    setResult({ status: 'error', msg: "沒有存進去 —— 請檢查網路，等一下再試一次；還是不行就告訴老師。" });
                } finally {
                    setIsProcessing(false);
                }
            };

            return (
                <div className="ac-float-backdrop">
                    <div className="ac-float-window theme-carnival p-6 sm:p-10 max-w-5xl w-full mx-auto relative my-auto">

                        <button onClick={onClose} className="absolute top-6 right-6 text-slate-400 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-full w-10 h-10 flex items-center justify-center transition-colors z-10">
                            <i className="fa-solid fa-xmark text-xl"></i>
                        </button>

                        <div className="text-center mb-8">
                            <h2 className="text-3xl sm:text-4xl font-black text-slate-800 mb-3 tracking-tight">運算思維通關確認系統</h2>
                            <p className="text-slate-500 font-medium">選好通關截圖、按下送出就會記錄完成。{GRADER_URL ? '截圖會存給老師看，' : '系統不會自動檢查截圖，'}老師可能會請你把通關畫面打開給他看。</p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div className="space-y-6">
                                <div>
                                    <label className="block text-sm font-bold text-slate-800 mb-2">
                                        <i className="fa-solid fa-image text-indigo-500 mr-2"></i>選擇通關截圖
                                    </label>
                                    <div
                                        className="border-2 border-dashed border-slate-300 rounded-[20px] p-8 text-center bg-slate-50 cursor-pointer hover:border-indigo-500 hover:bg-indigo-50 transition-all group relative"
                                        onClick={() => fileInputRef.current?.click()}
                                    >
                                        <input type="file" ref={fileInputRef} onChange={handleFileChange} accept="image/*" className="hidden" />
                                        {previewUrl ? (
                                            <img src={previewUrl} alt="預覽" className="max-h-[180px] mx-auto rounded-xl shadow-md" />
                                        ) : (
                                            <>
                                                <i className="fa-solid fa-image text-4xl text-slate-400 mb-4 group-hover:text-indigo-500 group-hover:scale-110 transition-transform"></i>
                                                <div className="text-slate-500 font-medium">點擊選擇圖片</div>
                                                <div className="text-xs text-slate-400 mt-2">系統會自己從檔名認出關卡，不用先選</div>

                                        )}
                                    </div>

                                    {selectedFile && matched && (
                                        <div className="mt-3 text-sm font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-xl px-4 py-2.5">
                                            <i className="fa-solid fa-circle-check mr-2"></i>
                                            系統認出這是「{matched.title}」的截圖
                                        </div>
                                    )}

                                    {selectedFile && !matched && (
                                        <div className="mt-3 text-sm bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 text-amber-800">
                                            <div className="font-bold mb-1">
                                                <i className="fa-solid fa-triangle-exclamation mr-2"></i>
                                                這個檔名看不出是哪一關
                                            </div>
                                            <div className="text-xs font-medium mb-2 text-amber-700 break-all">你選的是：{nameNote}</div>
                                            <div className="text-xs font-medium leading-relaxed">
                                                檔名要含關卡名，例如「滑梯公園 - Google Chrome ….png」。<br />
                                                ⇒ 請用 <b>Windows + Alt + PrintScreen</b>（擷取整個視窗）重截一次，
                                                或把檔名改成關卡名開頭再選一次。
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <button
                                    onClick={submit}
                                    disabled={!selectedFile || !matched || isProcessing || result?.status === 'pass'}
                                    className="w-full py-4 bg-indigo-500 text-white rounded-2xl font-bold flex justify-center items-center gap-2 shadow-[0_10px_20px_-10px_rgba(99,102,241,1)] hover:-translate-y-1 hover:shadow-[0_15px_25px_-10px_rgba(99,102,241,1)] transition-all disabled:bg-slate-300 disabled:shadow-none disabled:transform-none disabled:cursor-not-allowed mt-2"
                                >
                                    {isProcessing ? (
                                        <><i className="fa-solid fa-spinner animate-spin"></i> 記錄中…</>
                                    ) : result?.status === 'pass' ? (
                                        <><i className="fa-solid fa-circle-check"></i> 已完成</>
                                    ) : !selectedFile ? (
                                        <><i className="fa-solid fa-upload"></i> 請先選擇截圖</>
                                    ) : !matched ? (
                                        <><i className="fa-solid fa-file-circle-question"></i> 檔名看不出關卡，請重截一次</>
                                    ) : (
                                        <><i className="fa-solid fa-wand-magic-sparkles"></i> 送出並產生證書</>
                                    )}
                                </button>
                            </div>

                            <div className="flex flex-col h-full">
                                {!result && !isProcessing && (
                                    <div className="flex-1 flex flex-col items-center justify-center text-slate-400 bg-slate-50 border-2 border-dashed border-slate-200 rounded-[20px] p-10 text-center min-h-[300px]">
                                        <i className="fa-solid fa-award text-5xl text-slate-300 mb-4"></i>
                                        <div className="font-semibold text-slate-500">尚未產生通關證書</div>
                                        <div className="text-sm mt-2">請選擇截圖並按送出</div>
                                    </div>
                                )}

                                {result && result.status !== 'pass' && (
                                    <div className="flex-1 flex flex-col gap-6 animate-[fadeIn_0.3s_ease-out]">
                                        <div className="p-5 rounded-2xl font-bold text-lg flex items-start gap-3 bg-red-50 text-red-700 border border-red-200">
                                            <i className="fa-solid fa-circle-xmark text-2xl text-red-600 mt-0.5"></i>
                                            <span>{result.msg}</span>
                                        </div>
                                    </div>
                                )}

                                {/* 證書統一在「我的證書」看，這裡只說完成了、去哪裡看 */}
                                {result && result.status === 'pass' && (
                                    <div className="flex-1 flex flex-col items-center justify-center text-center bg-emerald-50 border-2 border-emerald-200 rounded-[20px] p-8 min-h-[300px] animate-[fadeIn_0.5s_ease-out]">
                                        <div className="bg-white text-emerald-500 shadow-sm w-20 h-20 rounded-full flex items-center justify-center mb-5">
                                            <i className="fa-solid fa-award text-4xl"></i>
                                        </div>
                                        <div className="text-2xl font-black text-emerald-800 leading-relaxed">{result.msg}</div>
                                        <div className="text-sm font-medium text-emerald-700 mt-3">
                                            {user.classRoom} 班 {user.seatNo} 號 {user.name}　·　{certDate}　·　學習耗時 {certTime}
                                        </div>
                                        {shotState === 'sending' && <div className="text-xs font-bold text-slate-500 mt-3"><i className="fa-solid fa-spinner animate-spin mr-1"></i>截圖交給老師中…（可以先關掉，不影響過關）</div>}
                                        {shotState === 'ok' && <div className="text-xs font-bold text-emerald-700 mt-3"><i className="fa-solid fa-cloud-arrow-up mr-1"></i>截圖已經交給老師</div>}
                                        {shotState === 'fail' && <div className="text-xs font-bold text-amber-700 mt-3"><i className="fa-solid fa-triangle-exclamation mr-1"></i>截圖沒有傳上去（過關已經記錄了，不用重送；老師要看的話再打開通關畫面給他看）</div>}
                                        {onOpenCerts && (
                                            <button onClick={() => { onClose(); onOpenCerts(); }}
                                                className="mt-6 px-6 py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-bold shadow-md transition-all transform hover:scale-105">
                                                <i className="fa-solid fa-trophy mr-2"></i>開啟我的證書
                                            </button>
                                        )}

                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 主應用程式 ---
        const App = () => {
            // 【測試模式】預設直接帶入測試島民身分，免登入即可直接進入神木林測試
            const [user, setUser] = useState({
                classRoom: '801',
                seatNo: '1',
                name: '測試島民',
                docId: '801_1_測試島民',
                sid: '1410101'
            });
            const [selectedChallenge, setSelectedChallenge] = useState(null);
            // 【測試模式】不卡登入讀取畫面
            const [loading, setLoading] = useState(false);
            const [showCertModal, setShowCertModal] = useState(false);
            const [showQueryModal, setShowQueryModal] = useState(false); 
            const [showMyCertsModal, setShowMyCertsModal] = useState(false); 
            const [completedChallenges, setCompletedChallenges] = useState([]); 
            /* completedRef：目前最新的通關清單。連續記錄好幾關時，
               state 還是那一次畫面的舊值，用它算會把前面幾關蓋掉。 */
            const completedRef = useRef([]);
            completedRef.current = completedChallenges;
            const [completedDates, setCompletedDates] = useState({}); 
            
            const [currentDate, setCurrentDate] = useState(new Date());
            const [studyTime, setStudyTime] = useState(0); 
            
            // 目前這一關的本班通關人數
            const [classPassCount, setClassPassCount] = useState(null);
            // 動森島嶼視角 / 傳統挑戰清單視角切換
            const [viewMode, setViewMode] = useState('island');
            const islandRef = useRef(null);
            const islandCtrlRef = useRef(null);

            /* 10 道謎題寫在 {學期}/config.js 的 THINKING.CHALLENGES（上下學期不同） */
            const challenges = ((window.CONFIG.THINKING || {}).CHALLENGES || [
                { id: 1, title: "跳格子", url: "https://reurl.cc/mpY8EY", difficulty: "★★" },
                { id: 2, title: "任意門", url: "https://reurl.cc/ovYkWl", difficulty: "★★" },
                { id: 3, title: "滑梯公園", url: "https://reurl.cc/DxOzRN", difficulty: "★★★" },
                { id: 4, title: "水餃工廠", url: "https://reurl.cc/6Gqo16", difficulty: "★★★" },
                { id: 5, title: "無括號計算機", url: "https://reurl.cc/Q2arzb", difficulty: "★★★" },
                { id: 6, title: "遊覽車共乘", url: "https://reurl.cc/53Rj6y", difficulty: "★★★" },
                { id: 7, title: "扭蛋轉轉樂", url: "https://reurl.cc/N2xvW5", difficulty: "★★★★" },
                { id: 8, title: "換零錢機", url: "https://reurl.cc/epkRrR", difficulty: "★★★★" },
                { id: 9, title: "打地鼠", url: "https://reurl.cc/ovYkj3", difficulty: "★★★★" },
                { id: 10, title: "拔蘿蔔", url: "https://reurl.cc/ppYlGr", difficulty: "★★★★" },
            ]).map(c => Object.assign({}, c));

            const getDifficultyColor = (level) => {
                switch (level) {
                    case "★": return "text-green-500";
                    case "★★": return "text-blue-500";
                    case "★★★": return "text-orange-500";
                    case "★★★★": return "text-red-500";
                    default: return "text-purple-500";
                }
            };

            useEffect(() => {
                if (user) {
                    const interval = setInterval(() => {
                        setCurrentDate(new Date());
                        setStudyTime(prev => prev + 1);
                    }, 1000);
                    return () => clearInterval(interval);
                }
            }, [user]);

            // 選了一關：算本班有幾人通關（走快取，不重抓）
            useEffect(() => {
                let isMounted = true;
                const fetchPassCount = async () => {
                    if (!selectedChallenge || !user) {
                        if (isMounted) setClassPassCount(null);
                        return;
                    }
                    if (isMounted) setClassPassCount('...'); // 顯示計算中
                    
                    try {
                        const rows = await loadClassRows(user.classRoom, false);
                        const count = rows.filter(d =>
                            d.completed && d.completed.includes(selectedChallenge.id)).length;
                        if (isMounted) setClassPassCount(count);
                    } catch (err) {
                        console.error("無法取得通關人數:", err);
                        if (isMounted) setClassPassCount('-');
                    }
                };
                
                fetchPassCount();
                return () => { isMounted = false; };
            }, [selectedChallenge, user, completedChallenges]);

            /* 記錄通關，寫兩份：
               ① artifacts/comp-think-app/…/progress/{班級_座號_姓名}：本頁自己的紀錄（證書、班級通關人數）
               ② {TERM}-progress/{學號}：闖關基地的星數與每週成績
               ① 失敗要讓學生知道（丟出錯誤）；② 失敗只記 log，下次登入會依 ① 重新同步。 */
            const handleChallengeComplete = async (challengeId, passDate) => {
                const cur = completedRef.current || [];
                if (cur.map(Number).includes(Number(challengeId))) return;   // 編號一律轉數字比（舊資料可能是字串）
                if (!fbStore.db || !user) throw new Error('資料庫還沒連上');

                /* sid：安全規則拿它去名冊組出「你應該用的文件 id」，對得上才准寫 */
                await fbStore.setDoc(fbStore.doc(fbStore.db, ...THINKING_COL_SEGMENTS(), user.docId), {
                    sid: user.sid,
                    completed: fbStore.arrayUnion(challengeId),
                    completionDates: { [challengeId]: passDate },
                    lastUpdated: new Date().toISOString(),
                    name: user.name,
                    classRoom: user.classRoom,
                    seatNo: user.seatNo
                }, { merge: true });

                const newCompleted = [...cur, challengeId];
                completedRef.current = newCompleted;
                setCompletedChallenges(newCompleted);
                setCompletedDates(prev => ({ ...prev, [challengeId]: passDate }));
                noteMyPass(user.classRoom, user.seatNo, challengeId);

                try {
                    const count = new Set(newCompleted.map(Number)).size;
                    const now = Date.now();
                    await fbStore.setDoc(fbStore.doc(fbStore.db, window.CONFIG.COLLECTIONS.PROGRESS, user.sid), {
                        studentId: user.sid,
                        modules: { thinking: { status: count >= 10 ? 'pass' : 'in-progress', level: count,
                                               stars: window.GRADING.thinkingStars(count), source: 'auto', updatedAt: now } },
                        history: fbStore.arrayUnion({ module: 'thinking', challenge: challengeId, at: now, stars: 2 }),
                        updatedAt: now
                    }, { merge: true });
                } catch (err) { console.error("回報闖關進度失敗:", err); }
            };

            /* 用闖關基地登入的學號載入名冊與進度（本頁不自己登入） */
            const doSidLogin = async (sid) => {
                const ok = await initFB();
                if (!ok || !fbStore.db) return '雲端連線失敗，請稍後再試';
                // 向名冊查學號
                let info = null;
                try {
                    const rsnap = await fbStore.getDoc(fbStore.doc(fbStore.db, window.CONFIG.COLLECTIONS.ROSTER, sid));
                    if (rsnap.exists()) info = rsnap.data();
                } catch (err) { console.error("名冊查詢失敗", err); return '驗證失敗，請稍後再試'; }
                if (!info) return `名冊中查無學號 ${sid}，請找老師確認名冊`;

                const classRoom = info.cls, seatNo = String(info.no), name = info.name;
                const docId = `${classRoom}_${seatNo}_${name}`;

                // 載入先前進度
                let loadedProgress = [], loadedDates = {};
                try {
                    const progressRef = fbStore.doc(fbStore.db, ...THINKING_COL_SEGMENTS(), docId);
                    const snap = await fbStore.getDoc(progressRef);
                    if (snap.exists()) {
                        const data = snap.data();
                        loadedProgress = data.completed || [];
                        loadedDates = data.completionDates || {};
                        Object.keys(data).forEach(key => {      // 舊格式：欄位名是「completionDates.3」
                            if (key.startsWith('completionDates.')) loadedDates[key.split('.')[1]] = data[key];
                        });
                    }
                } catch (err) { console.error("讀取進度失敗:", err); }

                // 依目前完成數重新同步闖關進度的星數（上一次 ② 沒寫成功也會在這裡補上）
                if (loadedProgress.length > 0) {
                    const cnt = new Set(loadedProgress.map(Number)).size;   // 重複的編號不重複算星
                    fbStore.setDoc(fbStore.doc(fbStore.db, window.CONFIG.COLLECTIONS.PROGRESS, sid), {
                        studentId: sid,
                        modules: { thinking: { status: cnt >= 10 ? 'pass' : 'in-progress', level: cnt, stars: window.GRADING.thinkingStars(cnt), source: 'auto', updatedAt: Date.now() } },
                        updatedAt: Date.now()
                    }, { merge: true }).catch(e => console.error('同步統一進度失敗', e));
                }

                sessionStorage.setItem(SID_KEY, sid);
                setUser({ classRoom, seatNo, name, docId, sid });
                setCompletedChallenges(loadedProgress);
                setCompletedDates(loadedDates);
                setStudyTime(0);
                return null;
            };


            // 載入時用闖關基地存的學號登入（測試模式下已在預設 state 載入測試島民，背景靜默嘗試同步即可）
            useEffect(() => {
                const saved = sessionStorage.getItem(SID_KEY);
                if (saved && window.CONFIG.isSid(saved) && saved !== '1410101') {
                    setLoading(true);
                    doSidLogin(saved).then(err => { if (err) setLoading(false); });
                }
            }, []);


            /* 「有沒有通關」只判斷一次（isDone），清單打勾、開不開遊戲、右邊顯示、證書鈕都用它。
               編號一律轉數字比；十關全拿用 every（completed 若有重複編號，長度會虛胖）。
               已通關的關卡點了不再開遊戲，只顯示本班通關人數。 */
            const doneSet = new Set((completedChallenges || []).map(Number));
            const isDone = (id) => doneSet.has(Number(id));
            const allDone = challenges.length > 0 && challenges.every(c => isDone(c.id));

            const handleOpenChallenge = (challenge) => {
                setSelectedChallenge(challenge);
                if (isDone(challenge.id)) return;
                const width = 1024;
                const height = 768;
                const left = (window.screen.width - width) / 2;
                const top = (window.screen.height - height) / 2;
                
                window.open(
                    challenge.url,
                    `Challenge_${challenge.id}`,
                    `width=${width},height=${height},top=${top},left=${left},toolbar=no,location=no,status=no,menubar=no,scrollbars=yes,resizable=yes`
                );
            };

            // 掛載動森島嶼探險地圖（森林奇幻遊樂園：10 座主題遊樂設施 ＋ 摩天輪證書所、旋轉木馬證書屋、班級進度榜）
            useEffect(() => {
                if (!user || viewMode !== 'island' || !islandRef.current || !window.AC_ISLAND) return;

                    { id: 1,  x: 20, y: 26, kind: 'carnival-hopscotch', sign: '01' }, // 跳格子
                    { id: 2,  x: 34, y: 23, kind: 'carnival-portal',    sign: '02' }, // 任意門
                    { id: 3,  x: 49, y: 24, kind: 'carnival-slide',     sign: '03' }, // 滑梯公園
                    { id: 4,  x: 64, y: 25, kind: 'carnival-dumpling',  sign: '04' }, // 水餃工廠
                    { id: 5,  x: 78, y: 29, kind: 'carnival-arcade',    sign: '05' }, // 無括號計算機
                    { id: 6,  x: 22, y: 50, kind: 'carnival-bus',       sign: '06' }, // 遊覽車共乘
                    { id: 7,  x: 37, y: 49, kind: 'carnival-gacha',     sign: '07' }, // 扭蛋轉轉樂
                    { id: 8,  x: 52, y: 52, kind: 'carnival-coin',      sign: '08' }, // 換零錢機
                    { id: 9,  x: 67, y: 50, kind: 'carnival-mole',      sign: '09' }, // 打地鼠
                    { id: 10, x: 80, y: 52, kind: 'carnival-radish',    sign: '10' }  // 拔蘿蔔

                    const ch = challenges.find(c => c.id === pos.id) || { id: pos.id, title: '', difficulty: '★★' };
                    const passed = isDone(ch.id);
                    return {
                        id: 'ch-' + ch.id,
                        x: pos.x,
                        y: pos.y,
                        kind: pos.kind,
                        sign: pos.sign,
                        fruit: pos.fruit,
                        num: String(ch.id).padStart(2, '0'),
                        label: ch.title,
                        sub: passed ? '✅ 已通關 · ' + ch.difficulty : '難度 ' + ch.difficulty,
                        speaker: '🎪 遊樂園關主・第 ' + ch.id + ' 關',
                        dialog: passed
                            ? '「' + ch.title + '」遊樂設施你已經拿到證書囉！（難度 ' + ch.difficulty + '）點選可查看本班通關人數。'
                            : '歡迎來到「' + ch.title + '」主題遊樂設施（難度 ' + ch.difficulty + '）：解開機關後記得截圖，去摩天輪印製通關證書喔！',
                        actionLabel: passed ? '👥 查看本班通關人數' : '🚀 啟動遊樂設施挑戰',
                        badgeHtml: passed
                            ? '<span class="bg-emerald-500 text-white text-[11px] font-black px-2 py-0.5 rounded-full shadow">✓ 已通關</span>'
                            : '<span class="bg-amber-100 text-amber-800 border border-amber-300 text-[11px] font-black px-2 py-0.5 rounded-full">' + ch.difficulty + '</span>'
                    };
                });

                nodes.push(
                    {
                        id: 'cert-make',
                        x: 34, y: 74,
                        kind: 'carnival-wheel',
                        num: '🎡',
                        label: allDone ? '十關全通關' : '摩天輪證書所',
                        sub: '上傳截圖領證書',
                        speaker: '🎡 摩天輪證書照相館',
                        dialog: allDone
                            ? '太強啦！遊樂園十座設施的通關證書你全都收集齊全了！'
                            : '過關後把完整畫面截圖交給摩天輪照相館，就能現場印製專屬通關證書、並計入闖關基地星數喔！',
                        actionLabel: allDone ? '🎉 已全數通關' : '🏅 製作通關證書'
                    },
                    {
                        id: 'my-certs',
                        x: 52, y: 75,
                        kind: 'carnival-carousel',
                        num: '🎠',
                        label: '木馬證書屋',
                        sub: '已拿 ' + challenges.filter(c => isDone(c.id)).length + '/10 張',
                        speaker: '🎠 旋轉木馬證書展示館',
                        dialog: '這裡收藏著你在森林遊樂園拿到的每一張通關證書，隨時可以打開來欣賞或下載保存！',
                        actionLabel: '🏆 查看我的證書'
                    },
                    {
                        id: 'class-query',
                        x: 70, y: 73,

                        { id: 'tk-tree-1', x: 14, y: 38, kind: 'pine-tree' },
                        { id: 'tk-tree-2', x: 85, y: 39, kind: 'fruit-tree', fruit: 'pear' },
                        { id: 'tk-tree-3', x: 18, y: 68, kind: 'fruit-tree', fruit: 'peach' },

                            setShowQueryModal(true);
                            return;

            return (

                                <span className="text-2xl">🌲</span>
                                <div>

                                    🏆 我的證書
                                </button>
                                <button
                                    onClick={() => { if (!allDone) setShowCertModal(true); }}
                                    disabled={allDone}
                                    className={`ac-pill transition ${allDone ? 'opacity-60 cursor-not-allowed' : 'hover:bg-amber-100 cursor-pointer'}`}
                                    style={{ background: allDone ? '#e2e8f0' : '#fef3c7', borderColor: '#f59e0b' }}
                                >
                                    {allDone ? '✅ 十關全通' : '📸 證書製作'}
                                </button>
                                <button onClick={() => setShowQueryModal(true)} className="ac-pill hover:bg-amber-100 transition cursor-pointer">
                                    📊 班級進度
                                </button>
                                <button
                                    onClick={() => setViewMode(viewMode === 'island' ? 'list' : 'island')}
                                    className="ac-pill hover:bg-amber-100 transition cursor-pointer"
                                    style={{ background: '#fef3c7', borderColor: '#f59e0b' }}
                                >
                                    {viewMode === 'island' ? '📋 切換挑戰清單' : '🏝️ 切換島嶼探險'}
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* 當前選擇關卡的即時狀態與本班通關人數提示條 */}
                    {selectedChallenge && (
                        <div className="max-w-[96vw] xl:max-w-[1680px] w-full mx-auto px-2 sm:px-4 mb-2">
                            <div className="bg-amber-50/95 border-2 border-amber-400 rounded-2xl px-4 py-2.5 shadow-md flex flex-wrap items-center justify-between gap-2">
                                <div className="flex items-center gap-2 text-sm font-bold text-amber-950">
                                    <span>{isDone(selectedChallenge.id) ? '🏆' : '🎮'}</span>
                                    <span>
                                        第 {selectedChallenge.id} 關「<b>{selectedChallenge.title}</b>」
                                        {isDone(selectedChallenge.id) ? '（已拿到證書）' : '（挑戰視窗已開啟，過關後請截圖點「證書製作」）'}
                                    </span>
                                </div>
                                <div className="flex items-center gap-2">
                                    {classPassCount !== null && (
                                        <span className="inline-flex items-center gap-1 bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-xs font-black border border-emerald-300">
                                            🔥 本班已通關：{classPassCount} 人
                                        </span>
                                    )}
                                    {!isDone(selectedChallenge.id) && (
                                        <button onClick={() => handleOpenChallenge(selectedChallenge)} className="px-3 py-1 bg-indigo-600 text-white rounded-full text-xs font-bold hover:bg-indigo-700">
                                            重新開啟視窗
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 動森島嶼探險模式 */}
                    {viewMode === 'island' ? (
                        <div className="max-w-[96vw] xl:max-w-[1680px] w-full mx-auto px-2 sm:px-4 flex-1">
                            <div ref={islandRef}></div>

                    ) : (
                    <main className="flex-1 max-w-[96vw] xl:max-w-[1680px] w-full mx-auto px-2 sm:px-4 py-4 flex flex-col lg:flex-row gap-6 overflow-hidden">
                        <aside className="w-full lg:w-1/3 xl:w-1/4 flex flex-col gap-4 h-full">
                            <div className="bg-white rounded-xl shadow-sm overflow-hidden flex flex-col h-full border border-slate-200">
                                <div className="p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between shrink-0">
                                    <h2 className="font-bold text-slate-700 flex items-center">
                                        <Icons.BookOpen className="w-5 h-5 mr-2 text-indigo-500" />挑戰清單
                                    </h2>
                                    <span className="text-xs bg-indigo-100 text-indigo-700 px-2 py-1 rounded-full font-medium">共 {challenges.length} 題</span>
                                </div>
                                <div className="overflow-y-auto p-2 space-y-2 flex-1">
                                    {challenges.map((challenge) => (
                                        <button
                                            key={challenge.id}
                                            onClick={() => handleOpenChallenge(challenge)}
                                            className={`w-full text-left p-4 rounded-lg transition-all duration-200 flex items-center justify-between group ${selectedChallenge?.id === challenge.id ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-indigo-50 text-slate-700'}`}
                                        >
                                            <div>
                                                <div className={`font-bold text-lg sm:text-xl ${selectedChallenge?.id === challenge.id ? 'text-white' : 'text-slate-800'}`}>
                                                    {challenge.id}. {challenge.title}
                                                    {isDone(challenge.id) && (
                                                        <i className={`fa-solid fa-circle-check ml-2 ${selectedChallenge?.id === challenge.id ? 'text-white' : 'text-emerald-500'}`} title="已通關"></i>
                                                    )}
                                                </div>
                                                <div className="text-sm mt-1 flex items-center">
                                                    <span className={`${selectedChallenge?.id === challenge.id ? 'text-indigo-200' : 'text-slate-400'} mr-1`}>難度:</span>

                                            {/* 已通關的關卡點了不開遊戲，圖示改成「人數」 */}

                                    <div className="text-center text-slate-400">
                                        <Icons.BookOpen className="w-16 h-16 mx-auto mb-4 text-slate-200" />
                                        <div className="text-lg font-medium text-slate-500">請選擇左側挑戰開始學習</div>
                                    </div>
                                )}
                            </div>

                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col sm:flex-row justify-between items-center gap-4 shrink-0">
                                <div className="flex items-center space-x-3">
                                    <Icons.Calendar className="w-6 h-6 text-indigo-500" />
                                    <div>
                                        <div className="text-sm text-slate-500">今天是</div>
                                        <div className="text-lg font-bold text-slate-800">{formatDate(currentDate)}</div>
                                    </div>
                                </div>
                                <div className="h-px w-full sm:h-10 sm:w-px bg-slate-200"></div>
                                <div className="flex items-center space-x-3">
                                    <Icons.Timer className="w-6 h-6 text-orange-500" />
                                    <div className="text-right">
                                        <div className="text-sm text-slate-500 text-left sm:text-right">本次學習時間</div>
                                        <div className="text-2xl font-mono font-bold text-indigo-600">{formatTime(studyTime)}</div>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </main>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
