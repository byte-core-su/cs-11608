<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dodo Airlines 3D 入境登機室 · 資訊科技闖關系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>
  <script src="shared/term.js?v=20261107v3"></script>
  <link rel="stylesheet" href="shared/island.css?v=20261107v3">
  <style>
    body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
  </style>
</head>
<body class="ac-theme-bg min-h-screen text-slate-800 p-2 sm:p-4 flex items-center justify-center">
  <main id="airport-terminal-mount" class="w-full max-w-[96vw] xl:max-w-[1440px] mx-auto my-2"></main>
  <script>
    (function () {
      var mountEl = document.getElementById('airport-terminal-mount');
      if (window.TERMSEL && window.TERMSEL.renderAirportCounter) {
        window.TERMSEL.renderAirportCounter(mountEl, {
          targetPath: 'course/hub.html',
          isModal: false,
          showTeacherLink: true
        });
      }
    })();
  </script>
</body>
</html>
