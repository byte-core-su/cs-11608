<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ★ 嵌入模式：放在教師管理後台（course/teacher.html）的分頁裡時，藏起自己的「回教師端」與標頭 -->
  <script>try { if (window.self !== window.top) document.documentElement.classList.add('embedded'); } catch (e) { document.documentElement.classList.add('embedded'); }</script>

  <title>作品評分</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
    .pop { animation: pop .25s ease-out; } @keyframes pop { from { opacity: 0; transform: translateY(6px); } }

  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <!-- =====================================================================
       🐱 作品評分（老師專用）
       ---------------------------------------------------------------------
       程式設計的作品星是 Apps Script（gas/grader.gs）和參考解答比對後寫進來的。
       這一頁讓老師：
         ① 一眼看全班每一關的星數與分數（還沒交的是空格）
         ② 點一格看細節：最高分、最近一次送出、備份在雲端硬碟的作品
         ③ 手動調整星數 —— 自動比對可能低估「解法和範例不一樣、但是對的」作品
         ④ 👯 相同作品：打開這一頁時（下課後）比對全年級，列出「同一個檔案」「出自同一個檔案」的作品，
            可以取消其中某位的那一關成績
       ★ 手動調整會記在 modules.scratch.teacherSet，格子上會標 ✍️，看得出哪些是老師給的。
       ⚠️ 學生之後再交，自動評分只會「往上加」：老師給 3⭐ 之後，學生再交拿 2⭐ 不會蓋掉。

       ★ 比對怎麼做（線索是評分時 gas/grader.gs 記在 modules.scratch.unitPrint 的）
         · 同一個檔案：指紋（作品內容的雜湊）一樣 —— 整個檔案原封不動轉傳。
         · 出自同一個檔案：兩份作品「特有的積木編號」有一半以上相同 —— 拿別人的檔案拖一下、改個數字再交。
           積木編號是 Scratch 建立積木時隨機產生的，自己拖出來的積木編號都不一樣，所以各做各的不會被標出來。
           「特有」＝扣掉空白範本的積木，以及這一關一半以上的人都有的積木（大家共同的起始檔）。
         · 上課時不比對：學生交作品時只多記一串編號，比對全部在老師打開這一頁時、在這台電腦上算。
       ★ 取消成績：那一關改成 0⭐，並把那一份的指紋和特有的積木編號記進 modules.scratch.revoked。
         學生再交同一個檔案（或改一點點）會被評分服務擋下；自己重做的新作品照常評分。
         取消錯了可以在格子的細節裡「撤銷取消」，星數會回到取消前。
       ⚠️ 只看得出「誰和誰一樣」，看不出誰抄誰。旁邊列的「交出時間」只是參考 —— 先交的不一定是原作者。
       ===================================================================== -->
  <div class="max-w-[1300px] mx-auto px-4 py-6">
    <div data-standalone>
      <a href="../course/teacher.html" class="text-sm font-bold text-slate-500 hover:text-slate-800">← 回教師端</a>
    </div>
    <p class="font-bold text-amber-600 text-sm">PROGRAMMING WORKS</p>
    <h1 class="text-2xl font-black">🐱 作品評分</h1>
    <p class="text-sm text-slate-500 mt-1 leading-relaxed">每一格是一位學生在那一關的作品星（和範例比對的結果）。點格子可以看細節、開作品、手動調整星數。</p>
    <div id="app" class="mt-5"></div>
  </div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserSessionPersistence }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, getDocs, doc, setDoc, arrayUnion }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const C = window.CONFIG || {};
const ROSTER = (C.COLLECTIONS && C.COLLECTIONS.ROSTER) || 'roster';
const PROGRESS = (C.COLLECTIONS && C.COLLECTIONS.PROGRESS) || (C.TERM + '-progress');
const UNITS = (C.UNITS || []).map((u, i) => ({ id: u[0], title: u[1], no: i + 1 }));
const app = initializeApp(C.FIREBASE);
const auth = getAuth(app);
setPersistence(auth, browserSessionPersistence).catch(() => {});
const db = getFirestore(app);

const el = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
const when = t => { if (!t) return '—'; const d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const state = { who: null, roster: [], prog: {}, klass: '', open: null, busy: '', msg: '', err: '', dupOpen: false };

/* ⚠️ 門檻要和 gas/grader.gs 的 PRINT 一樣（擋下取消過的作品也用這一組） */
const PRINT = { MIN_IDS: 5, RATIO: 0.5, COMMON: 0.5 };

onAuthStateChanged(auth, async u => {
  state.who = (u && u.email && AUTH.isTeacherEmail(u.email)) ? u : null;
  if (state.who) await load();
  draw();
});

async function load() {
  state.busy = '讀取名冊與作品星…'; draw();
  try {
    const [rs, ps] = await Promise.all([getDocs(collection(db, ROSTER)), getDocs(collection(db, PROGRESS))]);
    state.roster = rs.docs.map(d => ({ sid: d.id, ...(d.data() || {}) }))
      .sort((a, b) => String(a.cls).localeCompare(String(b.cls)) || (Number(a.no) || 0) - (Number(b.no) || 0));
    state.prog = {}; ps.forEach(d => { state.prog[d.id] = d.data() || {}; });
    dupCache = null;
    if (!state.klass && state.roster.length) state.klass = String(state.roster[0].cls || '');
    state.err = '';
  } catch (e) { state.err = '讀不到資料：' + (e.code || e.message); }
  state.busy = '';
}

const scratchOf = sid => (((state.prog[sid] || {}).modules || {}).scratch) || {};
const who = sid => state.roster.find(r => r.sid === sid) || { sid, cls: '', no: '', name: '（不在名冊）' };
const unitNo = unit => (UNITS.find(u => u.id === unit) || {}).no;

/* ── 👯 相同作品：打開這一頁時才比對（上課時不比對）────────────────
   回傳 { [關卡]: { groups: [{ sids, kind: 'same'|'derived', rate }], common: Set, distinct: { sid: [編號] } } }
   · same：指紋一樣；derived：特有的積木編號一半以上相同（以兩份裡積木少的那一份為分母）
   · 已經被取消、星數是 0 的那一份還是列出來（看得出這一群有哪些人），但不再提供「取消」 */
let dupCache = null;
function analyze() {
  if (dupCache) return dupCache;
  const out = {};
  UNITS.forEach(u => {
    const subs = [];
    Object.keys(state.prog).forEach(sid => {
      const pr = (scratchOf(sid).unitPrint || {})[u.id];
      if (pr && (pr.hash || pr.ids)) subs.push({ sid, hash: pr.hash || '', ids: String(pr.ids || '').split(' ').filter(Boolean) });
    });
    if (subs.length < 2) return;
    /* 共同的積木：這一關一半以上的人都有（大家從同一個起始檔開始）⇒ 不算特有 */
    const cnt = {};
    subs.forEach(x => new Set(x.ids).forEach(id => { cnt[id] = (cnt[id] || 0) + 1; }));
    const cut = Math.max(2, Math.ceil(subs.length * PRINT.COMMON));
    const common = new Set(Object.keys(cnt).filter(id => cnt[id] >= cut && subs.length >= 4));
    const distinct = {};
    subs.forEach(x => { distinct[x.sid] = x.ids.filter(id => !common.has(id)); });
    /* 倒排索引：編號 → 有這塊的人 ⇒ 只算真的有交集的兩兩組合 */
    const owners = {};
    subs.forEach(x => distinct[x.sid].forEach(id => { (owners[id] = owners[id] || []).push(x.sid); }));
    const shared = {};
    Object.values(owners).forEach(list => {
      if (list.length < 2) return;
      for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
        const k = list[i] < list[j] ? list[i] + '|' + list[j] : list[j] + '|' + list[i];
        shared[k] = (shared[k] || 0) + 1;
      }
    });
    /* 連成一群（A 像 B、B 像 C ⇒ 同一群）*/
    const parent = {}; const find = a => parent[a] === undefined || parent[a] === a ? (parent[a] = a) : (parent[a] = find(parent[a]));
    const link = (a, b) => { parent[find(a)] = find(b); };
    const pairs = [];
    const byHash = {};
    subs.forEach(x => { if (x.hash) (byHash[x.hash] = byHash[x.hash] || []).push(x.sid); });
    Object.values(byHash).forEach(list => { for (let i = 1; i < list.length; i++) { link(list[0], list[i]); pairs.push({ a: list[0], b: list[i], kind: 'same', rate: 1 }); } });
    Object.entries(shared).forEach(([k, n]) => {
      const [a, b] = k.split('|');
      const den = Math.min(distinct[a].length, distinct[b].length);
      if (den >= PRINT.MIN_IDS && n / den >= PRINT.RATIO) {
        const hs = subs.find(x => x.sid === a).hash;
        if (hs && hs === subs.find(x => x.sid === b).hash) return;   // 已經算在「同一個檔案」
        link(a, b); pairs.push({ a, b, kind: 'derived', rate: n / den });
      }
    });
    const groups = {};
    pairs.forEach(p => { const r = find(p.a); (groups[r] = groups[r] || { sids: new Set(), kind: 'derived', rate: 0 }); groups[r].sids.add(p.a); groups[r].sids.add(p.b);
      if (p.kind === 'same') groups[r].kind = 'same'; groups[r].rate = Math.max(groups[r].rate, p.rate); });
    const list = Object.values(groups).map(g => ({ ...g, sids: [...g.sids].sort((x, y) => ((scratchOf(x).unitPrint || {})[u.id].at || 0) - ((scratchOf(y).unitPrint || {})[u.id].at || 0)) }));
    if (list.length) out[u.id] = { groups: list, common, distinct };
  });
  return (dupCache = out);
}
/** 這一格有沒有被標成相同作品 */
function dupOf(sid, unit) {
  const d = analyze()[unit]; if (!d) return null;
  return d.groups.find(g => g.sids.includes(sid)) || null;
}

/* 取消成績：0⭐，記下指紋＋特有的積木編號（評分服務之後擋同一份）。history 記一筆（每週評分會用到增減） */
async function revoke(sid, unit) {
  const sc = scratchOf(sid), pr = (sc.unitPrint || {})[unit] || {};
  const d = analyze()[unit];
  const ids = d ? (d.distinct[sid] || []) : String(pr.ids || '').split(' ').filter(Boolean);
  const stars = Object.assign({}, sc.unitStars || {});
  const prev = Number(stars[unit]) || 0;
  stars[unit] = 0;
  const t = window.GRADING.scratchTotal(stars), now = Date.now();
  state.busy = '取消中…'; draw();
  try {
    await setDoc(doc(db, PROGRESS, sid), {
      studentId: sid,
      modules: { scratch: {
        unitStars: { [unit]: 0 }, unitScores: { [unit]: 0 }, stars: t.stars, level: t.done,
        status: t.done >= UNITS.length ? 'pass' : 'in-progress', updatedAt: now,
        teacherSet: { [unit]: { stars: 0, prev, prevScore: Number((sc.unitScores || {})[unit]) || 0, at: now, by: state.who.email, revoked: true } },
        revoked: { [unit]: arrayUnion({ hash: pr.hash || '', ids: ids.slice(0, 400).join(' '), at: now }) }
      } },
      history: arrayUnion({ module: 'scratch', unit, at: now, stars: -prev, by: 'teacher', revoked: true }),
      updatedAt: now
    }, { merge: true });
    await load();
    state.msg = '✅ 已取消 ' + who(sid).name + '（' + sid + '）第 ' + unitNo(unit) + ' 關的成績。之後再交同一個檔案會被擋下，自己重做的作品照常評分。';
  } catch (e) { state.err = '取消失敗：' + (e.code || e.message); state.busy = ''; }
  draw();
}

/* 撤銷取消：清掉這一關的 revoked，星數、分數回到取消前 */
async function unrevoke(sid, unit) {
  const sc = scratchOf(sid), t0 = (sc.teacherSet || {})[unit] || {};
  const back = Number(t0.prev) || 0;
  const stars = Object.assign({}, sc.unitStars || {}); stars[unit] = back;
  const t = window.GRADING.scratchTotal(stars), now = Date.now();
  state.busy = '撤銷中…'; draw();
  try {
    await setDoc(doc(db, PROGRESS, sid), {
      studentId: sid,
      modules: { scratch: {
        unitStars: { [unit]: back }, unitScores: { [unit]: Number(t0.prevScore) || 0 }, stars: t.stars, level: t.done,
        status: t.done >= UNITS.length ? 'pass' : 'in-progress', updatedAt: now,
        teacherSet: { [unit]: { stars: back, prev: 0, at: now, by: state.who.email, unrevoked: true } },
        revoked: { [unit]: [] }
      } },
      history: arrayUnion({ module: 'scratch', unit, at: now, stars: back, by: 'teacher', unrevoked: true }),
      updatedAt: now
    }, { merge: true });
    await load();
    state.msg = '✅ 已撤銷取消：' + who(sid).name + ' 第 ' + unitNo(unit) + ' 關回到 ' + back + '⭐。';
  } catch (e) { state.err = '撤銷失敗：' + (e.code || e.message); state.busy = ''; }
  draw();
}
/** 這一關最近一次送出的時間（從 history 找） */
function lastAt(sid, unit) {
  const h = ((state.prog[sid] || {}).history || []).filter(x => x && x.module === 'scratch' && x.unit === unit);
  return h.length ? Math.max(...h.map(x => Number(x.at) || 0)) : 0;
}

/* 手動調整星數：寫進 modules.scratch，重算總數；history 記一筆（每週評分會用到星數的增減） */
async function setStars(sid, unit, n) {
  const sc = scratchOf(sid);
  const stars = Object.assign({}, sc.unitStars || {});
  const prev = Number(stars[unit]) || 0;
  stars[unit] = n;
  const t = window.GRADING.scratchTotal(stars);
  const now = Date.now();
  state.busy = '儲存中…'; draw();
  try {
    await setDoc(doc(db, PROGRESS, sid), {
      studentId: sid,
      modules: { scratch: {
        unitStars: { [unit]: n }, stars: t.stars, level: t.done,
        status: t.done >= UNITS.length ? 'pass' : 'in-progress', updatedAt: now,
        teacherSet: { [unit]: { stars: n, prev, at: now, by: state.who.email } }
      } },
      history: arrayUnion({ module: 'scratch', unit, at: now, stars: n - prev, by: 'teacher' }),
      updatedAt: now
    }, { merge: true });
    await load();
    state.msg = '✅ 已把 ' + sid + ' 第 ' + (UNITS.find(u => u.id === unit) || {}).no + ' 關改成 ' + n + '⭐。';
  } catch (e) { state.err = '儲存失敗：' + (e.code || e.message); state.busy = ''; }
  draw();
}

function csv() {
  const rows = [['班級', '座號', '學號', '姓名'].concat(UNITS.map(u => '第' + u.no + '關星數')).concat(UNITS.map(u => '第' + u.no + '關分數')).concat(['作品星合計'])];
  state.roster.filter(r => String(r.cls) === state.klass).forEach(r => {
    const sc = scratchOf(r.sid), st = sc.unitStars || {}, so = sc.unitScores || {};
    rows.push([r.cls, r.no, r.sid, r.name].concat(UNITS.map(u => st[u.id] ?? '')).concat(UNITS.map(u => so[u.id] ?? '')).concat([sc.stars || 0]));
  });
  const text = '﻿' + rows.map(r => r.map(v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : v).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' }));
  a.download = '作品評分_' + state.klass + '.csv'; a.click();
}

function cellHtml(r, u) {
  const sc = scratchOf(r.sid);
  const s = (sc.unitStars || {})[u.id], score = (sc.unitScores || {})[u.id];
  const t = (sc.teacherSet || {})[u.id];
  const has = s !== undefined && s !== null;
  const dup = dupOf(r.sid, u.id), rv = ((sc.revoked || {})[u.id] || []).length > 0;
  const color = !has ? 'bg-white text-slate-300' : s >= 3 ? 'bg-emerald-100 text-emerald-800' : s >= 2 ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-700';
  return `<button class="cell rounded-lg px-1.5 py-1 text-center ${color} hover:ring-2 hover:ring-indigo-300" data-cell="${esc(r.sid)}|${esc(u.id)}" title="第 ${u.no} 關 ${esc(u.title)}">
    <div class="text-xs font-black leading-none">${has ? (s ? '⭐'.repeat(s) : '0⭐') : '—'}${rv ? '🚫' : t ? '✍️' : ''}${dup ? '👯' : ''}</div>
    <div class="text-[10px] mt-0.5">${score !== undefined ? esc(score) + ' 分' : '&nbsp;'}</div></button>`;
}

function dupBox(sid, unit) {
  const sc = scratchOf(sid), t = (sc.teacherSet || {})[unit] || {};
  const rv = ((sc.revoked || {})[unit] || []).length > 0, blocked = (sc.blocked || {})[unit];
  const g = dupOf(sid, unit);
  const others = g ? g.sids.filter(x => x !== sid).map(x => who(x)) : [];
  return `${g ? `<div class="mt-3 text-xs bg-rose-50 border border-rose-200 rounded-lg px-3 py-2 text-rose-800">
        👯 ${g.kind === 'same' ? '和下面這幾位交了<b>同一個檔案</b>' : '和下面這幾位的作品<b>出自同一個檔案</b>（特有的積木有 ' + Math.round(g.rate * 100) + '% 相同）'}：
        <div class="mt-1 font-bold">${others.map(o => esc(o.cls + ' 班 ' + o.no + ' 號 ' + o.name)).join('、')}</div></div>` : ''}
    ${rv ? `<div class="mt-3 text-xs bg-slate-100 rounded-lg px-3 py-2 text-slate-700">🚫 ${when(t.at)} 取消了這一關的成績（原本 ${Number(t.prev) || 0}⭐）。
        ${blocked ? `<br>⛔ 學生在 ${when(blocked.at)} 又交了被取消的那一份，已經擋下。` : ''}
        <button data-unrevoke="1" class="mt-2 block rounded-lg border border-slate-300 bg-white px-3 py-1 font-bold">撤銷取消（回到 ${Number(t.prev) || 0}⭐）</button></div>`
      : g && (Number((sc.unitStars || {})[unit]) || 0) > 0 ? `<button data-revoke="1" class="mt-3 w-full rounded-lg border border-rose-300 bg-white py-2 text-sm font-black text-rose-700 hover:bg-rose-50">🚫 取消這位的第 ${unitNo(unit)} 關成績</button>` : ''}`;
}

/** 👯 相同作品總覽（全年級，不分班） */
function dupPanel() {
  const all = analyze();
  const units = UNITS.filter(u => all[u.id]);
  const n = units.reduce((a, u) => a + all[u.id].groups.length, 0);
  if (!n) return `<p class="text-xs text-slate-400 mb-3">👯 相同作品：全年級目前沒有找到（打開這一頁時比對，上課時不比對）。</p>`;
  return `<div class="bg-rose-50 border border-rose-200 rounded-2xl px-4 py-3 mb-3">
    <button id="dup-toggle" class="w-full text-left font-black text-rose-800">👯 相同作品：${units.map(u => '第 ' + u.no + ' 關 ' + all[u.id].groups.length + ' 群').join('、')}　<span class="text-xs font-bold underline">${state.dupOpen ? '收起' : '展開'}</span></button>
    ${state.dupOpen ? units.map(u => all[u.id].groups.map(g => `
      <div class="mt-2 bg-white rounded-xl border border-rose-100 px-3 py-2 text-sm">
        <div class="text-xs font-black text-rose-700">第 ${u.no} 關 ${esc(u.title)}　·　${g.kind === 'same' ? '同一個檔案' : '出自同一個檔案（特有的積木 ' + Math.round(g.rate * 100) + '% 相同）'}</div>
        <div class="mt-1 flex flex-wrap gap-1.5">${g.sids.map(x => { const o = who(x), sc = scratchOf(x), st = Number((sc.unitStars || {})[u.id]) || 0, rv = ((sc.revoked || {})[u.id] || []).length > 0;
          return `<button data-cell="${esc(x)}|${esc(u.id)}" class="rounded-lg border px-2 py-1 text-xs ${rv ? 'border-slate-200 text-slate-400 line-through' : 'border-slate-300 hover:bg-slate-50'}">${esc(o.cls)}-${esc(o.no)} ${esc(o.name)}　${st}⭐　<span class="text-slate-400">${when(((sc.unitPrint || {})[u.id] || {}).at)}</span></button>`; }).join('')}</div>
      </div>`).join('')).join('') + '<p class="text-[11px] text-rose-700/70 mt-2">點名字打開細節，可以取消那一位的成績。時間是那一份交出的時間，只是參考 —— 先交的不一定是原作者。</p>' : ''}
  </div>`;
}

function detail() {
  if (!state.open) return '';
  const [sid, unit] = state.open;
  const r = state.roster.find(x => x.sid === sid) || {};
  const u = UNITS.find(x => x.id === unit) || {};
  const sc = scratchOf(sid);
  const s = Number((sc.unitStars || {})[unit]) || 0, score = (sc.unitScores || {})[unit];
  const file = (sc.unitFiles || {})[unit], t = (sc.teacherSet || {})[unit];
  return `<div class="fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4" data-close="1">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 pop" data-keep="1">
      <div class="text-xs text-slate-400 font-mono">${esc(r.cls)} 班 ${esc(r.no)} 號　${esc(sid)}</div>
      <h3 class="text-lg font-black">${esc(r.name)}　·　第 ${u.no} 關 ${esc(u.title)}</h3>
      <dl class="mt-4 grid grid-cols-3 gap-2 text-sm">
        <div class="bg-slate-50 rounded-lg p-2"><dt class="text-xs text-slate-400">目前星數</dt><dd class="font-black">${s ? '⭐'.repeat(s) : '0⭐'}</dd></div>
        <div class="bg-slate-50 rounded-lg p-2"><dt class="text-xs text-slate-400">最高分</dt><dd class="font-black">${score ?? '—'}</dd></div>
        <div class="bg-slate-50 rounded-lg p-2"><dt class="text-xs text-slate-400">最近送出</dt><dd class="font-black">${when(lastAt(sid, unit))}</dd></div>
      </dl>
      ${t && !t.revoked ? `<p class="mt-3 text-xs text-indigo-700 bg-indigo-50 rounded-lg px-3 py-2">✍️ 老師在 ${when(t.at)} 手動改成 ${t.stars}⭐（原本 ${t.prev}⭐）</p>` : ''}
      ${dupBox(sid, unit)}
      <p class="mt-3 text-sm">${file ? `<a href="${esc(file)}" target="_blank" rel="noopener" class="text-indigo-600 underline font-bold">📂 打開作品（雲端硬碟）</a>`
        : '<span class="text-slate-400">沒有備份的作品檔（評分服務沒設 DRIVE_FOLDER_ID，或還沒交）</span>'}</p>
      <div class="mt-5">
        <div class="text-xs font-black text-slate-500 mb-2">手動調整星數</div>
        <div class="flex gap-2">${[0, 2, 3].map(n => `<button data-set="${n}" class="flex-1 rounded-lg py-2 font-black border ${n === s ? 'bg-indigo-600 text-white border-indigo-600' : 'border-slate-300 hover:bg-slate-50'}">${n ? '⭐'.repeat(n) : '0⭐'}</button>`).join('')}</div>
        <p class="text-[11px] text-slate-400 mt-2 leading-relaxed">自動評分只會往上加：你給的星數之後不會被學生較低的成績蓋掉。</p>
      </div>
      <button data-close="1" class="mt-5 w-full rounded-lg border border-slate-300 py-2 font-bold text-slate-600">關閉</button>
    </div></div>`;
}

function draw() {
  const box = el('app');
  if (!state.who) {
    box.innerHTML = `<div class="bg-white rounded-2xl border border-slate-200 shadow p-8 text-center pop">
      <p class="font-black text-lg mb-1">請用教師帳號登入</p>
      <button id="login" class="mt-4 px-6 py-3 bg-slate-800 text-white font-black rounded-xl">教師登入</button>
      ${state.err ? `<p class="text-rose-600 text-sm mt-4">${esc(state.err)}</p>` : ''}</div>`;
    el('login').onclick = async () => {
      const c = await AUTH.askTeacherPassword(); if (!c) return;
      try { await signInWithEmailAndPassword(auth, c.email, c.password); }
      catch (e) { state.err = '登入失敗：' + (e.code || e.message); draw(); }
    };
    return;
  }
  const classes = [...new Set(state.roster.map(r => String(r.cls || '')))].filter(Boolean).sort();
  const list = state.roster.filter(r => String(r.cls || '') === state.klass);
  const sum = UNITS.map(u => {
    const got = list.map(r => (scratchOf(r.sid).unitStars || {})[u.id]).filter(v => v !== undefined && v !== null);
    return { pass: got.filter(v => v >= 2).length, sub: got.length };
  });
  box.innerHTML = `
    <div class="flex flex-wrap items-center gap-2 mb-3">
      ${classes.map(c => `<button data-klass="${esc(c)}" class="px-4 py-1.5 rounded-full text-sm ${c === state.klass ? 'bg-amber-500 text-white font-bold' : 'bg-white border border-slate-200 text-slate-600'}">${esc(c)}</button>`).join('') || '<span class="text-sm text-slate-400">名冊是空的 —— 先到「👥 學生帳號」匯入。</span>'}
      <span class="ml-auto"></span>
      <button id="csv" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-sm font-bold text-slate-600">下載 CSV</button>
      <button id="reload" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-sm font-bold text-slate-600">重新整理</button>
    </div>
    ${state.busy ? `<p class="text-sm text-slate-500 mb-3">${esc(state.busy)}</p>` : ''}
    ${state.msg ? `<p class="text-sm text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-2 mb-3">${esc(state.msg)}</p>` : ''}
    ${state.err ? `<p class="text-sm text-rose-700 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2 mb-3">${esc(state.err)}</p>` : ''}
    ${dupPanel()}
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-x-auto pop">
      <table class="text-sm min-w-full">
        <thead class="text-xs text-slate-500 bg-slate-50"><tr>
          <th class="px-3 py-2 text-left sticky left-0 bg-slate-50">座號</th><th class="px-3 py-2 text-left sticky left-12 bg-slate-50">姓名</th>
          ${UNITS.map((u, i) => `<th class="px-1 py-2 text-center" title="${esc(u.title)}">${u.no}<div class="font-normal text-[10px] text-slate-400">${sum[i].pass}/${list.length} 過</div></th>`).join('')}
          <th class="px-3 py-2 text-center">合計</th></tr></thead>
        <tbody>${list.map(r => `<tr class="border-t border-slate-100">
          <td class="px-3 py-1.5 sticky left-0 bg-white">${esc(r.no)}</td>
          <td class="px-3 py-1.5 font-bold whitespace-nowrap sticky left-12 bg-white">${esc(r.name)}</td>
          ${UNITS.map(u => `<td class="px-0.5 py-1">${cellHtml(r, u)}</td>`).join('')}
          <td class="px-3 py-1.5 text-center font-black text-amber-600">${scratchOf(r.sid).stars || 0}</td></tr>`).join('')}</tbody>
      </table>
    </div>
    <p class="text-xs text-slate-400 mt-3 leading-relaxed">顏色：綠 3⭐、黃 2⭐、紅 0⭐（交了但未滿 75 分）、白「—」還沒交。✍️ ＝ 老師手動調整過，👯 ＝ 和別人的作品相同，🚫 ＝ 已取消。欄位下方是「拿到 2⭐ 以上的人數」。</p>
    ${detail()}`;
}

document.addEventListener('click', e => {
  const k = e.target.closest('[data-klass]'); if (k) { state.klass = k.dataset.klass; state.msg = state.err = ''; draw(); return; }
  const c = e.target.closest('[data-cell]'); if (c) { state.open = c.dataset.cell.split('|'); state.msg = ''; draw(); return; }
  const s = e.target.closest('[data-set]');
  if (s && state.open) {
    const [sid, unit] = state.open, n = Number(s.dataset.set);
    if (confirm('把 ' + sid + ' 第 ' + (UNITS.find(u => u.id === unit) || {}).no + ' 關改成 ' + n + '⭐？')) { state.open = null; setStars(sid, unit, n); }
    return;
  }
  if (e.target.closest('#dup-toggle')) { state.dupOpen = !state.dupOpen; draw(); return; }
  if (e.target.closest('[data-revoke]') && state.open) {
    const [sid, unit] = state.open;
    if (confirm('取消 ' + who(sid).name + '（' + sid + '）第 ' + unitNo(unit) + ' 關的成績？\n\n改成 0⭐；之後再交同一個檔案（或改一點點）會被擋下，自己重做的作品照常評分。')) { state.open = null; revoke(sid, unit); }
    return;
  }
  if (e.target.closest('[data-unrevoke]') && state.open) {
    const [sid, unit] = state.open;
    if (confirm('撤銷取消 ' + who(sid).name + ' 第 ' + unitNo(unit) + ' 關？星數會回到取消前。')) { state.open = null; unrevoke(sid, unit); }
    return;
  }
  if (e.target.closest('[data-keep]') && !e.target.closest('button[data-close]')) return;
  if (e.target.closest('[data-close]')) { state.open = null; draw(); return; }
  if (e.target.closest('#csv')) { csv(); return; }
  if (e.target.closest('#reload')) { state.msg = state.err = ''; load().then(draw); }
});

draw();
</script>
</body>
</html>
